<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ROBITA 모바일 미리보기</title>
<style>*{box-sizing:border-box}body{margin:0;background:#e9ecf3;color:#1b1f33;font-family:-apple-system,"Malgun Gothic",sans-serif}header{background:#0a0e27;color:white;padding:15px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;font-size:13px}header b{letter-spacing:2px}header span{color:#b5bdd4;font-size:11px}a{color:#c7d8ff;margin-left:auto}select{background:#141a3a;color:white;border:1px solid #3b4264;border-radius:6px;padding:5px}main{padding:24px 12px;display:flex;justify-content:center}.device{width:390px;height:844px;max-width:100%;border-radius:20px;overflow:hidden;box-shadow:0 8px 32px #141a3a25;border:1px solid #d3d8e4;background:white}iframe{width:100%;height:100%;border:0;display:block}</style></head>
<body><header><b>● ROBITA</b><span>모바일 실시간 미리보기</span><label>화면 너비 <select id="size"><option value="390">390px</option><option value="320">320px</option><option value="430">430px</option></select></label><a href="/dashboard" target="_blank">일반 웹 관제 열기 ↗</a></header><main><div class="device" id="device"><iframe src="/rider" title="ROBITA 모바일 웹"></iframe></div></main><script>document.getElementById('size').onchange=e=>document.getElementById('device').style.width=e.target.value+'px';</script></body></html>
